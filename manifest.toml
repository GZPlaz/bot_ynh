packaging_format = 2

id = "siegebot"
name = "SiegeBot"
description.en = "Sarcastic Discord moderation bot for R6 Siege communities, with a web admin panel"

version = "3.0.0~ynh1"

maintainers = []

[upstream]
license = "MIT"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = true
disk = "100M"
ram.build = "200M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/siegebot"

    [install.init_main_permission]
    help = "Who can open the admin panel. Keep this as admins only!"
    type = "group"
    default = "admins"

    [install.bot_token]
    ask.en = "Discord bot token (from https://discord.com/developers/applications)"
    help = "You can change it later from the admin panel."
    type = "string"

    [install.owner_ids]
    ask.en = "Your Discord user ID(s), comma separated (unlocks the secret troll commands)"
    type = "string"

    [install.clone_service]
    ask.en = "Also install the voice clone service (opt-in AI voice clones)?"
    help.en = "Heavy: needs about 4 GB of free RAM and 6 GB of disk, and adds 10+ minutes to the install. Runs on CPU (10-40 s per sentence). You can add or remove it later under Applications → SiegeBot → Configuration → Plugins, or point the bot at a GPU machine instead (see INSTALL.md)."
    type = "boolean"
    default = false

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    leaderboard.url = "/public"
    leaderboard.allowed = "visitors"
    leaderboard.show_tile = false
    leaderboard.auth_header = false

    [resources.ports]
    main.default = 8095
    clone.default = 8765

    [resources.apt]
    packages = "python3-venv, python3-pip, ffmpeg, libopus0, espeak-ng"
